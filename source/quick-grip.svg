<svg xmlns="http://www.w3.org/2000/svg" class="quick-arc" viewBox="0 0 14 34" fill="none" aria-hidden="true" focusable="false">
  <!-- Насечка повторяет кромку панели: дуга концентрична её левому скруглению
       (радиус корпуса 22, отступ внутрь 6 — отсюда радиус 16) и оборвана на
       140°, чтобы уложиться в высоту ряда. Точки — круглые концы штрихов
       нулевой длины, шаг 5.59 = длина дуги / 7, поэтому крайние точки стоят
       ровно на её концах. -->
  <path d="M11.528 1.965 A16 16 0 0 0 11.528 32.035"
        stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="0 5.586"/>
</svg>
