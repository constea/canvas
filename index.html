<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>onCanvas</title>
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=3" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png?v=3" sizes="16x16" type="image/png">
<link rel="alternate icon" href="/favicon.ico?v=3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<meta name="theme-color" content="#eceeed">
<!-- GSAP (локально) — пружинный отклик кнопок. Классический скрипт
     грузится до отложенного модуля, поэтому window.gsap доступен в tools.js. -->
<script src="/gsap.min.js"></script>
<style>
  :root {
    color-scheme: light;
    /* Два материала интерфейса: серый «стол» — и всё белое, что на нём лежит.
       Лист и панели одного тона, серый работает только как разделяющий их фон. */
    --app-bg: #eceeed;
    --paper: #ffffff;
    --text: #151515;
    --muted: #6b6f6d;
    --line: rgba(21, 21, 21, 0.11);
    --line-strong: rgba(21, 21, 21, 0.18);
    --panel: rgba(255, 255, 255, 0.9);
    --panel-solid: #ffffff;
    /* Кромка бумаги — чуть заметнее внутренних линий: это край материала. */
    --paper-edge: rgba(21, 21, 21, 0.15);
    --paper-radius: 8px;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.10), 0 2px 10px rgba(0, 0, 0, 0.05);
    --accent: #10a37f;
    --accent-soft: rgba(57, 77, 254, 0.13);
    --accent-line: rgba(57, 77, 254, 0.25);
    --danger: #cf2e2e;
    --ui-strong: #151515;
    /* Чёрный логотипа — тот же, что на плашке иконки приложения (favicon.svg):
       во вкладке браузера и в углу доски лежит один и тот же предмет. */
    --brand-ink: #36373b;
    --radius: 8px;
    --control: 32px;
    /* Шкала отступов тулбаров.
       Считаем расстояния между «чернилами» — видимыми глифами, а не между
       боксами кнопок: тап-цель у всех одна (--control), а глиф внутри почти
       один и тот же — плитка цвета 20px у пера и маркера, иконка 21px у
       остальных инструментов. Один и тот же gap давал бы на вид разные
       зазоры, поэтому отступы корректируются на «воздух» внутри тап-цели —
       --tb-slack-*. Три ступени, каждая заметно крупнее предыдущей:
         сосед по набору ~15px → соседний набор ~22px → соседняя группа 28px. */
    --tb-pad: 4px;      /* внутренний отступ корпуса панели */
    --tb-item: 2px;     /* зазор между тап-целями внутри набора */
    --tb-set: 3px;      /* добавка на границе наборов внутри одной группы */
    --tb-group: 10px;   /* от разделителя до глифа — поровну с обеих сторон */
    /* Отступ от корпуса до глифа равен вертикальному: панель обтекает кнопки
       одинаково со всех сторон. */
    --tb-edge: calc(var(--tb-pad) + var(--tb-slack-dot));
    --tb-slack-dot: calc((var(--control) - var(--dot-size)) / 2); /* плитка цвета */
    --tb-slack-icon: calc((var(--control) - 21px) / 2);     /* иконка */

    /* Плитка цвета пера и маркера. Форма — та же, что у иконок остальных
       инструментов: скруглённый квадрат чуть меньше тап-цели, а не пилюля.
       Отличает инструменты не форма, а заливка (см. .swatch .dot). */
    --dot-size: 20px;
    --dot-radius: 10px;

    /* Верхняя строка интерфейса складывается из трёх величин, и обе внешние —
       именно те зазоры, которые видно: от края окна до панели и от панели до
       кромки листа. Высота панели считается, а не подбирается, поэтому запас
       сверху сам подстраивается под --control и --tb-pad. */
    --chrome-top: max(4px, env(safe-area-inset-top));   /* окно → верх панели */
    --chrome-gap: 4px;                                   /* низ панели → кромка листа */
    /* Зазор между соседними панелями верхней полосы. Заметно крупнее любого
       шага ВНУТРИ панели (--tb-group: 10px): там расстояние между наборами
       кнопок, здесь — между отдельными предметами на столе, у каждого своя
       кромка и своя тень. Виден он только на узком экране, где панели сходятся
       вплотную; на широком его съедают автополя средней панели. */
    --chrome-band-gap: 12px;
    --chrome-h: calc(var(--control) + var(--tb-pad) * 2 + 2px);
    /* Запас сверху: холст начинается ниже панели инструментов, чтобы toolbar
       не перекрывал то, что можно нарисовать у верхнего края. С трёх остальных
       сторон лист просто приподнят над краем окна. --side-reserve — это ширина
       стола у края окна: слева она и есть поле листа, справа за ней начинается
       дорожка прокрутки. */
    --top-reserve: calc(var(--chrome-top) + var(--chrome-h) + var(--chrome-gap));
    --side-reserve: max(8px, env(safe-area-inset-left), env(safe-area-inset-right));
    --bottom-reserve: max(10px, env(safe-area-inset-bottom));

    /* Полоса прокрутки убрана с бумаги на стол — в свою дорожку справа от листа.
       Её внешний край стоит на тех же --side-reserve от окна, что и левое поле
       листа: стол по краям окна везде одной ширины, а лист просто уступает
       справа ширину дорожки. */
    --scroll-w: 10px;
    --scroll-gap: 6px;                                   /* полоса → кромка листа */
    --scroll-lane: calc(var(--scroll-w) + var(--scroll-gap));
    /* Кромки листа: правая — она же правый край toolbar. Панели и бумага
       держат общую вертикаль, дорожка прокрутки проходит снаружи от них
       справа. */
    --paper-left: var(--side-reserve);
    --paper-right: calc(var(--side-reserve) + var(--scroll-lane));
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--app-bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  button,
  input {
    font: inherit;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    position: fixed;
    inset: 0;
    /* Стол, на котором лежит лист: серый фон видно в полосе под панелями,
       у нижнего края и в скруглениях углов бумаги. */
    background: var(--app-bg);
  }

  .stage {
    position: absolute;
    inset: var(--top-reserve, 0px) var(--paper-right, 0px) var(--bottom-reserve, 0px) var(--paper-left, 0px);
    overflow: hidden;
    /* Углы запечены в самом листе: overflow срезает по этому радиусу и холсты,
       и плавающие окна, и уезжающую на резинке бумагу. */
    border-radius: var(--paper-radius);
    background: var(--paper);
    cursor: crosshair;
  }

  /* Кромка листа по всем четырём сторонам: теперь стол виден и по бокам, так
     что обрывать линию на углах было бы нечем. Отдельный слой поверх холстов,
     а не border у .stage: рамка сдвинула бы содержимое и увела координаты пера
     от экранных. */
  .stage::after {
    content: "";
    position: absolute;
    z-index: 16;
    inset: 0;
    border: 1px solid var(--paper-edge);
    border-radius: inherit;
    pointer-events: none;
  }

  .stage.erase {
    cursor: none;
  }

  .stage.lasso {
    cursor: default;
  }

  /* Курсор над «хватом» изображения. Правило идёт последним, поэтому берёт верх
     и над ластиком (где курсор скрыт), и над лассо — при равной специфичности. */
  .stage.grab {
    cursor: grab;
  }

  .stage.grabbing {
    cursor: grabbing;
  }

  /* Только три холста самого листа — они лежат друг на друге во всю рабочую
     область. Холсты плавающих окон вложены глубже и живут по своим правилам,
     поэтому здесь именно дочерний комбинатор, а не «любой canvas внутри». */
  .stage > canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #back {
    z-index: 1;
    background: var(--paper);
  }

  #ink {
    z-index: 2;
    pointer-events: none;
  }

  #overlay {
    z-index: 3;
    touch-action: none;
  }

  /* Верхняя полоса: три панели одного набора в одном ряду.
     Раньше каждая висела сама по себе на position: fixed, и панель разговора,
     выставленная по центру ОКНА, налезала на шапку инструментов — та занимает
     справа шестьсот с лишним пикселей и достаёт до середины экрана. В общем
     ряду место делится между соседями: разговор прижат к левому краю полосы,
     шапка — к правому, и наложение невозможно по построению — при любой ширине
     окна и любом наборе кнопок.
     Сама полоса указатель не ловит: между панелями рисуют по листу. */
  .chrome-band {
    position: fixed;
    z-index: 20;
    top: var(--chrome-top);
    left: var(--paper-left);
    right: var(--paper-right);
    display: flex;
    align-items: flex-start;
    gap: var(--chrome-band-gap);
    pointer-events: none;
  }

  .chrome-band > * {
    pointer-events: auto;
  }

  .toolbar {
    order: 3;
    flex: 0 1 auto;              /* тесно станет — сожмётся только шапка */
    width: max-content;
    max-width: 100%;
    display: flex;
    align-items: stretch;
    /* Весь горизонтальный воздух между группами живёт в padding самих групп —
       так разделитель оказывается ровно посередине зазора. */
    gap: 0;
    padding: var(--tb-pad);
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }

  .toolbar::-webkit-scrollbar {
    display: none;
  }

  .group {
    /* Чем заполнены края группы — от этого зависит, сколько «воздуха» кнопка
       приносит с собой и сколько отступа нужно добавить. Края считаются
       отдельно: слева у группы может стоять иконка, а справа — точка. */
    --tb-slack: var(--tb-slack-icon);
    --tb-slack-end: var(--tb-slack);
    display: flex;
    align-items: center;
    gap: var(--tb-item);
    min-width: max-content;
    padding-inline-start: calc(var(--tb-group) - var(--tb-slack));
    padding-inline-end: calc(var(--tb-group) - var(--tb-slack-end));
    border-right: 1px solid var(--line);
  }

  .group.colors { --tb-slack: var(--tb-slack-dot); }
  .group.tools { --tb-slack-end: 0px; }  /* справа — единая полоса толщины */
  .group.status { --tb-slack: 0px; }

  /* Крайние группы прижимаются к корпусу панели, а не к соседу, поэтому у них
     внешний отступ считается от --tb-edge, а не от --tb-group. */
  .group:first-child {
    padding-inline-start: max(0px, calc(var(--tb-edge) - var(--tb-pad) - var(--tb-slack)));
  }

  .group:last-child {
    padding-inline-end: max(0px, calc(var(--tb-edge) - var(--tb-pad) - var(--tb-slack-end)));
    border-right: 0;
  }

  /* Начало нового набора внутри группы: ступень заметнее, чем между соседями,
     но мельче, чем через разделитель. Ею же отодвигаются разрушающие действия
     (очистить доску) — чтобы не попасть в них промахом. */
  .set-start {
    margin-inline-start: var(--tb-set);
  }

  .group-label {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .swatches,
  .segmented {
    display: flex;
    align-items: center;
    gap: var(--tb-item);
  }

  .btn,
  .swatch {
    width: var(--control);
    height: var(--control);
    border: 1px solid transparent;
    border-radius: 999px;
    display: inline-grid;
    place-items: center;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
  }

  .btn {
    padding: 0 10px;
    width: auto;
    min-width: var(--control);
    font-size: 13px;
    font-weight: 570;
    white-space: nowrap;
  }

  .btn.icon {
    width: var(--control);
    padding: 0;
    font-size: 16px;
  }

  .btn.icon .m-icon {
    width: 21px;
    height: 21px;
    display: block;
    overflow: visible;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.18));
    transition: transform 140ms ease, filter 140ms ease;
  }

  #eraserBtn .m-icon {
    width: 22px;
    height: 22px;
  }

  #noteBtn .m-icon,
  #imgBtn .m-icon {
    width: 24px;
    height: 24px;
  }

  #exportBtn .m-icon {
    width: 17px;
    height: 17px;
  }

  .btn.icon:hover .m-icon,
  .btn.icon.on .m-icon {
    transform: translateY(-1px);
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.18));
  }

  .btn.icon:disabled .m-icon {
    filter: grayscale(0.75) opacity(0.55);
  }

  .m-edge {
    stroke: rgba(29, 34, 32, 0.22);
    stroke-width: 1;
  }

  .m-highlight {
    fill: rgba(255, 255, 255, 0.62);
  }

  /* Перо и маркер — такие же кнопки инструмента, как ластик или лассо:
     наведение и выбор показываются тем же корпусом, а не ореолом вокруг
     цвета. Иначе половина шапки подсвечивалась бы одним способом, половина
     другим. */
  .btn:hover,
  .swatch:hover {
    background: rgba(21, 21, 21, 0.055);
  }

  .btn:focus-visible,
  .swatch:focus-visible,
  .size:focus-visible {
    outline: 2px solid var(--accent-line);
    outline-offset: 2px;
  }

  .btn.on,
  .swatch.sel {
    border-color: var(--accent-line);
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 1px rgba(16, 163, 127, 0.08);
  }

  .btn:active,
  .swatch:active {
    transform: translateY(1px);
  }

  .btn:disabled {
    opacity: 0.34;
    cursor: default;
    transform: none;
  }

  .btn.danger {
    color: var(--danger);
  }

  /* Корпус свотча ничем не отличается от корпуса кнопки инструмента: та же
     тап-цель --control, то же скругление, та же прозрачная рамка под
     подсветку выбора. */
  .swatch {
    padding: 0;
  }

  /* Три толщины живут в общей полосе. Сегменты сохраняют исходную форму,
     а тонкая рамка лишь подчёркивает их границы. */
  .sizes {
    --size-segment: 26px;
    /* Серая обводка выбранного сегмента. На чёрной заливке она читается как
       средне-серый, поэтому задана осветлением, а не цветом линий: при смене
       заливки контур останется на том же расстоянии от неё по светлоте. */
    --size-sel-ring: rgba(255, 255, 255, 0.34);
    --size-sel-ring-w: 2px;
    display: grid;
    grid-template-columns: repeat(3, var(--size-segment));
    width: calc(var(--size-segment) * 3 + 2px);
    height: calc(var(--size-segment) + 2px);
    border: 1px solid var(--line-strong);
    border-radius: 14px; /* 50% от общей высоты 28px */
    overflow: hidden;
  }

  .size {
    position: relative;
    width: var(--size-segment);
    height: var(--size-segment);
    padding: 0;
    /* Собственной рамки у сегмента нет: по краям полосы его границу уже рисует
       рамка контейнера, а прямоугольный контур сегмента пересекал бы её
       скругление наискось. Разделители внутри — отдельные линии (см. ниже).
       Внутренние углы прямые. */
    border: 0;
    border-radius: 0;
    background: transparent;
    cursor: pointer;
    transition: background-color 120ms ease, box-shadow 120ms ease;
  }

  /* Наружные углы крайних сегментов повторяют внутренний радиус полосы (14px
     минус её рамка). Заливку там и так обрезает контур контейнера — радиус
     нужен обводке: она идёт по форме бокса, и без него её угол резал бы
     скругление полосы наискось. Внутренние углы остаются прямыми. */
  .size:first-child {
    border-radius: 13px 0 0 13px;
  }

  .size:last-child {
    border-radius: 0 13px 13px 0;
  }

  /* Разделитель — линия того же цвета и толщины, что и внешняя рамка, поэтому
     все линии полосы читаются как одна система. Она отдельный слой, а не рамка
     сегмента: так линия гаснет рядом с обводкой выбранного, не трогая ни его
     заливку, ни ширину сегмента. */
  .size + .size::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--line-strong);
    transition: opacity 120ms ease;
  }

  /* Полоса обрезает всё, что выходит за её контур, поэтому фокус уходит внутрь:
     снаружи кольцо срезалось бы вместе с углами. */
  .size:focus-visible {
    outline-color: var(--accent);
    outline-offset: -2px;
  }

  .size:not(.sel):hover {
    background: rgba(21, 21, 21, 0.07);
  }

  /* Выбранный сегмент — заливка с серой обводкой по своим границам. Обводка
     идёт внутрь: полоса обрезает всё, что выходит за её контур, а на краях она
     ложится ровно вдоль внешней рамки и повторяет её скругление. */
  .size.sel {
    background: var(--text);
    box-shadow: inset 0 0 0 var(--size-sel-ring-w) var(--size-sel-ring);
  }

  /* Собственные разделители по бокам выбранного сегмента убираются: рядом с
     его обводкой они складывались бы в двойную линию. */
  .size.sel::before,
  .size.sel + .size::before {
    opacity: 0;
  }

  /* Плитка цвета — тот же скруглённый квадрат, что рисуют иконки остальных
     инструментов, и с той же тенью: перо и маркер стоят в одном ряду с
     ластиком и лассо и не должны выглядеть предметом другой природы.
     Цвет приходит с кнопки в --dot-c (его задаёт tools.js). */
  .swatch .dot {
    width: var(--dot-size);
    height: var(--dot-size);
    border-radius: var(--dot-radius);
    border: 1px solid rgba(0, 0, 0, 0.16);
    background: var(--dot-c);
    box-shadow:
      0 1px 1px rgba(0, 0, 0, 0.18),
      inset 0 0 0 1px rgba(255, 255, 255, 0.45);
    transition: box-shadow 120ms ease, transform 120ms ease;
  }

  /* Раз форма у пера и маркера общая, различает их заливка. Перо кладёт
     сплошной цвет, маркер — ступени: три полосы одного цвета разной плотности,
     как накладывающиеся друг на друга полупрозрачные проходы маркера. Границы
     ступеней резкие (две позиции у каждого стопа), поэтому это читается как
     ступенчатая шкала, а не как обычная растяжка.
     Правило целиком отваливается там, где нет color-mix, и остаётся сплошная
     заливка выше — маркер тогда просто выглядит как перо, а не как пустая
     плитка. */
  .swatch.hl .dot {
    background: linear-gradient(
      135deg,
      color-mix(in srgb, var(--dot-c) 34%, #fff) 0 34%,
      color-mix(in srgb, var(--dot-c) 66%, #fff) 34% 67%,
      var(--dot-c) 67% 100%);
  }

  .presence {
    border: 0;
    min-height: var(--control);
    min-width: 58px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 12px;
    border-radius: 999px;
    background: rgba(21, 21, 21, 0.045);
    color: var(--muted);
    font-size: 13px;
    font-weight: 560;
    white-space: nowrap;
    cursor: pointer;
    transition: background 120ms ease, transform 120ms ease;
  }

  .presence:hover {
    background: rgba(21, 21, 21, 0.065);
  }

  .presence:active {
    transform: translateY(1px);
  }

  .presence-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(16, 163, 127, 0.12);
  }

  /* --- Разговор --------------------------------------------------------- */

  /* Третья панель того же набора: корпус, высота и радиус повторяют .toolbar и
     буква в букву — иначе она читалась бы как чужая деталь поверх доски.
     Сверху слева: разговор не принадлежит инструментам справа, а левый край
     полосы свободен — там он никого не теснит и стоит на месте, а не ездит
     вслед за шириной шапки. Внутри — обычная .group, поэтому вся арифметика отступов
     («воздух» внутри тап-цели, края к корпусу) достаётся ей даром. */
  .voicebar {
    order: 2;
    /* Единственная панель полосы, которой позволено сжиматься, — эта.
       Раньше сжималась шапка инструментов (flex: 0 1 auto + overflow: auto,
       то есть минимальная ширина ноль), и на окне около тысячи пикселей
       начавшийся разговор молча срезал ей правый край вместе с «очистить» и
       счётчиком участников — причём доскроллить до него на тачскрине нельзя:
       body держит touch-action: none. Теперь место уступает ряд точек: он
       украшение, а не управление. Кнопки не сжимаются никогда (см. ниже). */
    /* Сжиматься панели разрешено — но только за счёт ряда точек (см. ниже).
       На узком телефоне места ей иначе не хватает, и кнопки уезжали бы за край
       экрана: «положить трубку» становилась недосягаемой. */
    flex: 0 1 auto;
    /* Без этого сжатие не начнётся вовсе: у флекс-элемента собственный
       минимум по умолчанию равен содержимому, а содержимое тут — тот самый
       ряд точек, который и должен уступать место. */
    min-width: 0;
    /* Панель примагничена к левой кромке листа: своё поле слева нулевое, всё
       свободное место уходит в правое. Соседей слева нет, поэтому левый край
       разговора встаёт ровно по левому краю бумаги — та же вертикаль, что у
       листа и у нижних панелей, а не плавающая середина, которая ездила по
       экрану при каждом изменении ширины шапки инструментов. */
    margin-inline: 0 auto;
    width: max-content;
    max-width: 100%;
    display: flex;
    align-items: stretch;
    gap: 0;
    padding: var(--tb-pad);
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
  }

  /* Что именно уступает место, когда его не хватает.
     Кнопки не сжимаются никогда, ряд точек — сколько угодно. Содержимое
     прижато к правому краю, а лишнее обрезается: значит за кромку уходит
     сначала ряд точек и логотип СЛЕВА, а микрофон и трубка справа остаются
     целыми и нажимаемыми. Без justify-content: flex-end обрезалось бы
     наоборот — по правому краю, то есть ровно те кнопки, ради которых панель
     и существует. */
  .voicebar .group {
    min-width: 0;
    overflow: hidden;
    justify-content: flex-end;
    /* Слева в группе стоит логотип — сплошная плашка, а не глиф внутри
       тап-цели: «воздуха» он с собой не приносит, и отмерять отступ до корпуса
       не от чего. Поля у плашки со всех четырёх сторон одни и те же --tb-pad,
       как у кнопки, поэтому собственный отступ группы слева обнуляется. */
    padding-inline-start: 0;
  }

  .voicebar .btn {
    flex: 0 0 auto;
  }

  .voicebar .voice-dots {
    min-width: 0;
    flex: 0 1 auto;
  }

  /* .btn задаёт display: inline-grid, а .voice-dots — display: flex. Авторское
     правило перебивает hidden из таблицы браузера, поэтому и микрофон вне
     разговора, и пустой ряд точек остались бы видимыми. */
  .btn[hidden],
  .voice-dots[hidden] {
    display: none;
  }

  /* Две иконки в одной ячейке грида: состояние переключается классом, а не
     переписыванием разметки — метка <!--icon:...--> подставляется один раз, и
     градиенты внутри неё не задваиваются. */
  .btn.icon > .ico {
    grid-area: 1 / 1;
    display: block;
  }

  #callBtn .ico-call-end,
  #micBtn .ico-mic-off {
    display: none;
  }

  #callBtn.on .ico-call {
    display: none;
  }

  #callBtn.on .ico-call-end {
    display: block;
  }

  #micBtn.muted .ico-mic {
    display: none;
  }

  #micBtn.muted .ico-mic-off {
    display: block;
  }

  /* Кольцо вокруг микрофона — уровень собственного сигнала. Главный вопрос
     любого разговора «меня слышно?» отвечается ещё до того, как его задали.
     --lvl пишется инлайном пятнадцать раз в секунду: непрерывный сигнал в
     CSS-переход не укладывается, его ведут покадрово из JS, а короткий
     transition только сглаживает ступеньки. */
  .voice-mic {
    position: relative;
  }

  .voice-mic .voice-ring {
    position: absolute;
    inset: 3px;
    border-radius: 999px;
    box-shadow: 0 0 0 var(--lvl, 0px) rgba(16, 163, 127, 0.18);
    transition: box-shadow 90ms linear;
    pointer-events: none;
  }

  /* Крайний слева элемент панели — логотип: имя продукта у самой кромки листа,
     первым во всей верхней полосе. Единственная деталь интерфейса, которая
     ничего не делает, поэтому и стоит до всех кнопок, а не между ними.
     Раньше здесь стоял индикатор громкости разговора — дорожка в девять
     делений; логотип занял его место буква в букву: та же высота, тот же край,
     та же роль «показания, а не управления».
     Плашка — тот же чёрный, что у иконки приложения: во вкладке браузера и в
     углу доски лежит один и тот же предмет. Высота ровно в тап-цель
     (--control), поэтому ряд не становится выше, а поля плашки до корпуса
     панели со всех сторон равны --tb-pad — как у кнопки.
     Логотип неподвижен: он сидит в общем ряду с кнопками, и любое его
     шевеление таскало бы за собой весь ряд под пальцем. */
  .brand {
    /* Не сжимается никогда: сплюснутый логотип хуже обрезанного, а обрезать
       его на совсем узком экране панель умеет и сама (overflow у .group). */
    flex: 0 0 auto;
    height: var(--control);
    padding-inline: 10px;
    /* До соседа справа — столько же чернил, сколько между глифами соседних
       кнопок: у иконки половина этого зазора спрятана внутри тап-цели, а у
       плашки чернила доходят до самого края — недостающую половину и
       добавляем. */
    margin-inline-end: var(--tb-slack-icon);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: var(--brand-ink);
    color: var(--paper);
    /* Скруглению плашки верят все, кто внутри: чернила логотипа кончаются
       раньше кромки, но пусть режет она. */
    overflow: hidden;
    /* Предмет, а не текст: ни выделения протяжкой, ни курсора-каретки. */
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  .brand-word {
    display: block;
    /* Высота — по прописной букве: viewBox обрезан ровно по «C», без полей
       сверху и снизу, поэтому это число и есть высота чернил. Ширину картинка
       добирает сама из пропорций слова, а плашка — из ширины картинки. */
    height: 13px;
    width: auto;
  }

  /* Разговор идёт, а меня в нём нет: медленный ореол — приглашение, не тревога. */
  @keyframes voice-live {
    0%, 100% { box-shadow: 0 0 0 0 rgba(16, 163, 127, 0.30); }
    60%      { box-shadow: 0 0 0 7px rgba(16, 163, 127, 0); }
  }

  #callBtn.live:not(.on) {
    border-radius: 999px;
    animation: voice-live 2.2s ease-out infinite;
  }

  #callBtn.pending {
    cursor: default;
  }

  .voice-dots {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* Цвет точки — цвет курсора того же человека (--peer ставит voice.js). */
  .voice-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--peer, var(--accent));
    box-shadow: 0 0 0 var(--lvl, 0px) var(--peer-soft, rgba(16, 163, 127, 0.30));
    transition: box-shadow 90ms linear, opacity 140ms ease;
  }

  /* Замолчал — заливка; выключил микрофон — только контур. «Звука нет вовсе»
     обязано читаться иначе, чем «сейчас молчит». */
  .voice-dot.muted {
    background: transparent;
    box-shadow: inset 0 0 0 2px var(--peer, var(--accent));
  }

  .voice-dot.away {
    opacity: 0.34;
  }

  .voice-dot.lost {
    background: transparent;
    box-shadow: inset 0 0 0 2px var(--danger);
  }

  .voice-more {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* Единственная бесконечная анимация в проекте — и единственное место, где
     уважение к системной настройке движения обязательно. */
  @media (prefers-reduced-motion: reduce) {
    #callBtn.live:not(.on) {
      animation: none;
      box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.28);
    }

    .voice-dot,
    .voice-mic .voice-ring,
    .size,
    .size::before {
      transition: none;
    }
  }

  .vbar {
    position: fixed;
    z-index: 12;
    /* Дорожка идёт по столу вдоль правой кромки листа и повторяет его высоту
       ровно: положение бегунка читается как окно, вырезанное из полотна. */
    top: var(--top-reserve);
    right: var(--side-reserve);
    bottom: var(--bottom-reserve);
    width: var(--scroll-w);
    border-radius: 999px;
    background: rgba(21, 21, 21, 0.045);
    opacity: 1;
    pointer-events: auto;
  }

  .thumb {
    position: absolute;
    left: 2px;
    right: 2px;
    min-height: 28px;
    border-radius: 999px;
    background: rgba(21, 21, 21, 0.34);
    cursor: grab;
    touch-action: none;
  }

  .thumb:active {
    cursor: grabbing;
  }

  .eraser-cursor {
    position: absolute;
    /* Выше плавающих окон: ластиком работают и внутри них, а кольцо должно
       показывать размер пятна и там. */
    z-index: 14;
    width: 28px;
    height: 28px;
    border: 1.5px solid #a6425b;
    border-radius: 50%;
    background-color: #d17f8f;
    
    background-size: 8px 8px, 9px 9px, 11px 11px;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.88),
      inset 0 1px 2px rgba(255, 238, 242, 0.72),
      inset 0 -1px 2px rgba(122, 38, 59, 0.24);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: opacity 80ms ease;
  }

  .eraser-cursor.show {
    opacity: 1;
  }

  .toast {
    position: fixed;
    z-index: 30;
    left: 50%;
    bottom: calc(var(--bottom-reserve) + 12px);
    max-width: min(420px, calc(100vw - 32px));
    transform: translate(-50%, 12px);
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel-solid);
    box-shadow: var(--shadow);
    color: var(--text);
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease, transform 160ms ease;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* --- Плавающие окна ---
     Маленький холст поверх листа: пишут в нём теми же инструментами, что и на
     доске. Слой НЕ участвует в прокрутке — камера уезжает, окно остаётся на том
     же месте экрана, причём у всех участников в одной и той же его части
     (единицы координат — см. normalizeNote в storage.js). */
  .notes {
    position: absolute;
    inset: 0;
    z-index: 12;
    pointer-events: none;
  }

  /* Ширину и высоту получает только холст внутри, а корпус обтекает его сам:
     рамка и шапка не входят в мировые размеры окна. */
  .note {
    position: absolute;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel-solid);
    box-shadow: var(--shadow);
    cursor: default;
    pointer-events: auto;
    transition: border-color 140ms ease, box-shadow 140ms ease;
  }

  .note.dragging {
    box-shadow: 0 26px 60px rgba(0, 0, 0, 0.16), 0 3px 12px rgba(0, 0, 0, 0.07);
  }

  .note-canvas {
    display: block;
    /* Жесты браузера (прокрутка, зум) здесь не нужны: холст ведёт линию. */
    touch-action: none;
    cursor: crosshair;
  }

  .stage.erase .note-canvas {
    cursor: none;
  }

  .stage.lasso .note-canvas {
    cursor: default;
  }

  /* Шапка — единственное место, за которое окно двигают: внутри текста жест
     принадлежит выделению, а не перетаскиванию. */
  .note-bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 4px 0 9px;
    border-bottom: 1px solid var(--line);
    background: rgba(21, 21, 21, 0.045);
    cursor: grab;
    touch-action: none;
  }

  .note.dragging .note-bar {
    cursor: grabbing;
  }

  .note-grip {
    flex: 1;
    height: 9px;
    background-image: radial-gradient(circle, var(--line-strong) 1px, transparent 1.15px);
    background-size: 6px 5px;
    opacity: 0.75;
  }

  .note-close {
    flex: none;
    width: 20px;
    height: 20px;
    padding: 0;
    display: inline-grid;
    place-items: center;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }

  .note-close:hover {
    background: rgba(207, 46, 46, 0.12);
    color: var(--danger);
  }

  .note-close svg {
    display: block;
    width: 12px;
    height: 12px;
  }

  .note-resize {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 20px;
    height: 20px;
    cursor: nwse-resize;
    touch-action: none;
  }

  /* Уголок-«уголок»: две насечки, как у ручки изменения размера картинки. */
  .note-resize::after {
    content: "";
    position: absolute;
    right: 4px;
    bottom: 4px;
    width: 9px;
    height: 9px;
    border-right: 1.5px solid var(--line-strong);
    border-bottom: 1.5px solid var(--line-strong);
    border-bottom-right-radius: 3px;
  }

  /* --- Быстрая панель ---
     Плавающая полоса 3×1 поверх листа: ластик, перо, маркер. Каждая ячейка —
     переключатель на два положения: ластик ↔ последний инструмент, перо
     цвет 1 ↔ цвет 2, маркер цвет 1 ↔ цвет 2. Рука не выбирает из шести
     кнопок, а бьёт в одну из трёх и получает второе положение повторным
     нажатием — палитра под пером, а не меню.
     Панель живёт поверх листа, двигается за ползунок слева и встаёт только в
     узлы сетки: позиций конечное число, поэтому панель не «плавает» на пиксель
     мимо. Область хода — от левой кромки листа до правой и ниже toolbar; JS
     считает её по самим панелям, чтобы быстрая палитра не наезжала на них
     сверху. Положение переживает перезагрузку (localStorage). */
  .quickbar {
    /* Ячейка ужата к самому свотчу: видимый зазор в панели складывается из
       запаса внутри ячейки и gap, поэтому уменьшать нужно прежде всего ячейку —
       при 38px вокруг 28px-точки оставалось 10px воздуха на каждой стороне. */
    --qb-cell: 34px;
    --qb-gap: 0px;
    position: fixed;
    z-index: 24;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    gap: var(--qb-gap);
    padding: var(--tb-pad);
    border: 1px solid var(--line);
    /* Один ряд круглых кнопок обводится пилюлей: корпус повторяет форму того,
       что внутри, как и у остальных панелей интерфейса. */
    border-radius: 999px;
    background: var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    /* До первой раскладки координат ещё нет — панель не должна мигнуть в углу. */
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease, box-shadow 140ms ease, transform 140ms ease;
  }

  .quickbar.ready {
    opacity: 1;
    pointer-events: auto;
  }

  /* Приземление после броска: единственная фаза, где координаты едут плавно.
     Во время перетаскивания transition выключен — иначе панель отстаёт от
     пальца, а магнит к узлу перестаёт читаться как щелчок. */
  .quickbar.settling {
    transition: left 190ms cubic-bezier(0.22, 1, 0.36, 1),
                top 190ms cubic-bezier(0.22, 1, 0.36, 1),
                opacity 160ms ease, box-shadow 140ms ease, transform 140ms ease;
  }

  .quickbar.dragging {
    box-shadow: 0 26px 60px rgba(0, 0, 0, 0.16), 0 3px 12px rgba(0, 0, 0, 0.07);
    transform: scale(1.03);
  }

  /* Ползунок: единственное место, за которое панель тянут. Стоит справа
     четвёртой ячейкой — тот же круг того же размера, что у кнопок, поэтому
     полоса читается как один набор предметов, а не как три кнопки с
     приделанной сбоку рейкой. Внутри насечка из точек, та же, что у шапки
     плавающего окна: жест читается одинаково во всём интерфейсе. */
  .quick-grip {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--qb-cell);
    height: var(--qb-cell);
    border-radius: 999px;
    cursor: grab;
    touch-action: none;
    transition: background 120ms ease;
  }

  /* Подсветка та же, что у кнопок под курсором: ячейка живая, за неё берутся. */
  .quick-grip:hover,
  .quickbar.dragging .quick-grip {
    background: rgba(21, 21, 21, 0.055);
  }

  .quickbar.dragging .quick-grip {
    cursor: grabbing;
  }

  /* Две колонки по три точки: насечка занимает середину ячейки и оставляет по
     краям тот же воздух, что глифы соседних кнопок. */
  .quick-grip-dots {
    width: 10px;
    height: 18px;
    background-image: radial-gradient(circle, var(--line-strong) 1px, transparent 1.15px);
    background-size: 5px 6px;
    opacity: 0.75;
  }

  /* Ряд кнопок: ластик, перо, маркер — слева направо, ползунок за ними. */
  .quick-body {
    display: flex;
    gap: var(--qb-gap);
  }

  .quickbar .quick-cell {
    width: var(--qb-cell);
    height: var(--qb-cell);
    padding: 0;
  }

  /* Иконка ластика не меняется ни при каком состоянии: кнопка на своём месте
     узнаётся по глифу, а не по тому, что произойдёт по нажатию. Включён он или
     нет, показывает подсветка корпуса — как и у остальных инструментов. */
  #quickEraserBtn .m-icon {
    width: 22px;
    height: 22px;
  }

  /* Узлы сетки проступают только на время перетаскивания: пока панель несут,
     видно, куда именно она может встать, а в покое поле пустое. Точки стоят
     там, где окажется центр панели, — поэтому и сама сетка выглядит как ряд
     посадочных мест, а не как разметка под угол корпуса. */
  .quick-grid-hint {
    position: fixed;
    z-index: 23;
    opacity: 0;
    pointer-events: none;
    background-image: radial-gradient(circle, var(--line-strong) 1.2px, transparent 1.7px);
    transition: opacity 150ms ease;
  }

  .quick-grid-hint.show {
    opacity: 0.45;
  }

  /* Фолбэк пружинного «попа» при нажатии, если GSAP не загрузился. */
  .tap-pop {
    animation: tap-pop-kf 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes tap-pop-kf {
    from { transform: scale(0.8); }
    to { transform: scale(1); }
  }

  @media (max-width: 760px) {
    :root {
      --control: 31px;
      /* --top-reserve и --chrome-h пересчитаются сами: они выражены через
         --chrome-top, --control и --tb-pad. */
      --chrome-top: max(8px, env(safe-area-inset-top));
      --side-reserve: max(8px, env(safe-area-inset-left), env(safe-area-inset-right));
      --bottom-reserve: max(8px, env(safe-area-inset-bottom));
      --paper-radius: 14px;
      /* Ступени поджимаются, но их порядок сохраняется: сосед < набор < группа. */
      --tb-pad: 5px;
      --tb-set: 6px;
      --tb-group: 12px;
    }

    .btn {
      padding: 0 8px;
      font-size: 12px;
    }

    /* Полоса остаётся наверху вместе с разговором. Раньше она уезжала вниз:
       считалось, что шапка инструментов занимает наверху всю ширину. На
       телефоне это не так — от неё остаётся один счётчик участников (см.
       следующий блок), и места в верхней полосе хватает обоим: разговор слева
       у кромки листа, счётчик справа. Так весь интерфейс доски собран в одну
       строку сверху, а низ экрана целиком отдан бумаге — и ничего не лежит
       там, где на телефоне живёт системная полоса жестов. */
  }
  /* Телефон: инструменты правки уходят с экрана целиком.
     Рисовать пальцем по листу шириной с ладонь всё равно нечем, а шапка из
     шести цветов, четырёх толщин, лассо, вставки и истории занимала там всю
     верхнюю полосу и продолжала отъедать место у бумаги. На телефоне доска
     остаётся тем, чем она на телефоне и полезна: посмотреть доску и
     поговорить. Правят её с планшета и с десктопа.

     Порог не сводится к одной ширине. Телефон в альбомной ориентации — это
     852px (iPhone 14 Pro) при высоте в четыреста точек: по ширине он проходит
     за планшет и получал бы полную шапку на экран, где её физически некуда
     положить. Поэтому вторым условием идёт низкий экран с грубым указателем.
     Планшет в альбоме под него не попадает (у iPad Mini высота 744px), а
     короткое окно на десктопе отсекается по pointer: fine. */
  @media (max-width: 760px), (max-height: 500px) and (pointer: coarse) {
    /* Плавающая палитра — те же кнопки, что и в шапке, и уходит вместе с ней.
       Заодно поле её посадочных мест: показывать его больше нечему. */
    .quickbar,
    .quick-grid-hint {
      display: none;
    }

    /* Шапка убирается не целиком: в ней живёт счётчик участников, а он про
       «кто здесь», а не про правку. Скрыты группы, а не их содержимое, —
       корпус остаётся прежней высоты (--chrome-h считается от --control и
       --tb-pad), поэтому --top-reserve пересчитывать не нужно: лист стоит
       ровно там же, где стоял, и никакой пустой полосы сверху не появляется. */
    .toolbar > .group:not(.status) {
      display: none;
    }

    /* Единственной оставшейся группе нужны поля крайней с ОБЕИХ сторон:
       правое ей и так достаётся по :last-child, а :first-child по разметке
       принадлежит скрытому «Перу» — без этого пилюля вышла бы кривой. */
    .toolbar > .group.status {
      padding-inline-start: max(0px, calc(var(--tb-edge) - var(--tb-pad) - var(--tb-slack)));
    }
  }

</style>

<body>
<main class="app" aria-label="onCanvas">
  <section id="stage" class="stage" aria-label="Рабочая область доски">
    <canvas id="back"></canvas>
    <canvas id="ink"></canvas>
    <canvas id="overlay"></canvas>
    <div id="notes" class="notes"></div>
    <div id="eraserCursor" class="eraser-cursor" aria-hidden="true"></div>
    <div id="vbar" class="vbar" aria-hidden="true">
      <div id="thumb" class="thumb"></div>
    </div>
  </section>

  <!-- Порядок в разметке — шапка, затем разговор; порядок на экране задаёт
       CSS (order). Так последовательность обхода с клавиатуры остаётся прежней:
       сначала инструменты рисования, которыми пользуются постоянно. -->
  <div class="chrome-band">
  <header class="toolbar" aria-label="Инструменты доски">
    <div class="group colors" aria-label="Цвета ручки">
      <span class="group-label">Перо</span>
      <div id="penColors" class="swatches" data-swatches="pen"></div>
    </div>

    <div class="group colors" aria-label="Цвета маркера">
      <span class="group-label">Маркер</span>
      <div id="hlColors" class="swatches" data-swatches="hl"></div>
    </div>

    <div class="group tools" aria-label="Инструменты">
      <button id="lassoBtn" class="btn icon" type="button" aria-pressed="false" aria-label="Лассо" title="Лассо (L)">
        <!--icon:lasso-->
      </button>
      <button id="eraserBtn" class="btn icon" data-act="eraser" type="button" aria-pressed="false" aria-label="Ластик" title="Ластик (E)">
        <!--icon:eraser-->
      </button>
      <div id="sizes" class="sizes set-start" role="radiogroup" aria-label="Толщина линии" aria-orientation="horizontal"></div>
    </div>

    <div class="group" aria-label="Вставка">
      <button id="noteBtn" class="btn icon" type="button" aria-label="Добавить плавающее окно" title="Плавающее окно (N)">
        <!--icon:note-->
      </button>
      <button id="imgBtn" class="btn icon" type="button" aria-label="Добавить изображение" title="Добавить изображение">
        <!--icon:image-->
      </button>
      <button id="exportBtn" class="btn icon" type="button" aria-label="Скачать PDF" title="Скачать PDF">
        <!--icon:export-->
      </button>
    </div>

    <div class="group" aria-label="История">
      <button id="undoBtn" class="btn icon" type="button" title="Отменить (Ctrl/Cmd+Z)" disabled aria-label="Отменить">
        <!--icon:undo-->
      </button>
      <button id="redoBtn" class="btn icon" type="button" title="Повторить (Ctrl/Cmd+Y)" disabled aria-label="Повторить">
        <!--icon:redo-->
      </button>
      <button id="clearBtn" class="btn icon danger set-start" type="button" aria-label="Очистить доску" title="Очистить доску">
        <!--icon:clear-->
      </button>
    </div>

    <div class="group status" aria-label="Статус">
      <button id="presenceBtn" class="presence" type="button" title="Обновить страницу" aria-label="Обновить страницу">
        <span class="presence-dot" aria-hidden="true"></span>
        <span id="userCount">0</span>
        <span class="sr-only">онлайн</span>
      </button>
    </div>
  </header>

      <!-- Точки участников разговора: цвет тот же, что у курсора этого человека,
           — кто рисует и кого слышно читается одним взглядом. Живой регион здесь
           был бы невыносим (пульс на каждое слово), поэтому изменения состава
           уходят в #voiceStatus. -->
      <div id="voiceDots" class="voice-dots" aria-hidden="true" hidden></div>
      <button id="micBtn" class="btn icon voice-mic" type="button" aria-pressed="false"
              aria-label="Выключить микрофон" title="Выключить микрофон (M)" disabled>
        <span class="voice-ring" aria-hidden="true"></span>
        <span class="ico ico-mic"><!--icon:mic--></span>
        <span class="ico ico-mic-off"><!--icon:mic-off--></span>
      </button>
      <button id="callBtn" class="btn icon" type="button" aria-pressed="false"
              aria-label="Начать разговор" title="Начать разговор">
        <span class="ico ico-call"><!--icon:call--></span>
        <span class="ico ico-call-end"><!--icon:call-end--></span>
      </button>
      <span id="voiceStatus" class="sr-only" role="status" aria-live="polite"></span>
    </div>
  </nav>
  </div>

  <!-- Быстрая панель: три переключателя под рукой — плавает над листом и
       таскается за ползунок слева. Ластик меняется местами с последним
       инструментом, перо и маркер — со своим вторым цветом. Кнопки собирает и
       подсвечивает tools.js: разметка тут только каркас. -->
  <aside id="quickbar" class="quickbar" aria-label="Быстрая панель инструментов">
    <div id="quickBody" class="quick-body">
      <button id="quickEraserBtn" class="btn icon quick-cell" data-act="eraser-toggle" type="button" aria-pressed="false" aria-label="Ластик" title="Ластик (E)">
        <!--icon:eraser-->
      </button>
      <button id="quickPenBtn" class="swatch quick-cell" data-quick="pen" type="button" aria-pressed="false" aria-label="Ручка" title="Ручка">
        <span class="dot"></span>
      </button>
      <button id="quickHlBtn" class="swatch hl quick-cell" data-quick="hl" type="button" aria-pressed="false" aria-label="Маркер" title="Маркер">
        <span class="dot"></span>
      </button>
    </div>
    <div id="quickGrip" class="quick-grip" title="Перетащить панель">
      <span class="quick-grip-dots" aria-hidden="true"></span>
    </div>
  </aside>

  <!-- Поле посадочных мест быстрой панели: видно только пока её несут. -->
  <div id="quickGridHint" class="quick-grid-hint" aria-hidden="true"></div>

  <input id="fileInput" class="sr-only" type="file" accept="image/*">
  <!-- Приёмники удалённого звука. Именно .sr-only, а не display:none: скрытый
       через display аудиоэлемент часть браузеров перестаёт играть. -->
  <div id="voiceSinks" class="sr-only" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Заготовка плавающего окна: разметка живёт здесь (и иконка подставляется
       так же, как в тулбарах), а notes.js только клонирует её на каждое окно. -->
  <template id="noteTpl">
    <div class="note">
      <div class="note-bar">
        <span class="note-grip" aria-hidden="true"></span>
        <button class="note-close" type="button" aria-label="Удалить окно" title="Удалить окно">
          <!--icon:note-close-->
        </button>
      </div>
      <canvas class="note-canvas" aria-label="Холст плавающего окна"></canvas>
      <span class="note-resize" aria-hidden="true"></span>
    </div>
  </template>
</main>

<script type="module">
import { BoardStorage } from './storage.js';
import { CanvasRenderer } from './canvas.js';
import { NetworkManager } from './network.js';
import { HistoryManager } from './history.js';
import { ToolManager } from './tools.js';
import { NotesManager } from './notes.js';
import { VoiceManager } from './voice.js';

(function() {
  "use strict";

  const storage = new BoardStorage();

  const renderer = new CanvasRenderer(storage);
  // Удалённые операции и undo/redo только помечают кадр «грязным» —
  // фактическая перерисовка коалесится в один вызов на animation frame.
  const network = new NetworkManager(
    storage,
    () => renderer.scheduleRender(),
    (point) => renderer.focusWorldPoint(point)
  );
  network.onRemoteCursor = (clientId, point) => renderer.setRemoteCursor(clientId, point);
  const history = new HistoryManager(storage, network, () => renderer.scheduleRender());
  const tools = new ToolManager(storage, renderer, network, history);
  // Плавающие окна — маленькие холсты поверх листа: пишут в них теми же
  // инструментами, но к экрану они приклеены, а не к бумаге, поэтому камера их
  // не двигает.
  const notes = new NotesManager(storage, renderer, network, history, tools);
  // Разговор поверх доски: свой полносвязный меш, но сигналинг едет тем же
  // сокетом и мимо состояния доски. Подключается ДО network.init(): состав
  // разговора приходит сразу за presence, ещё до первого нарисованного штриха.
  const voice = new VoiceManager(storage, network, renderer);
  network.onVoiceMessage = (msg) => voice.handleMessage(msg);
  network.onSocketOpen = () => voice.onSocketOpen();
  voice.init();

  document.getElementById('presenceBtn')?.addEventListener('click', () => {
    // Во время разговора перезагрузка обрывает связь всем, кто нас слушает, —
    // просим подтвердить вторым нажатием.
    if (voice.guardReload()) return;
    window.location.reload();
  });

  network.init();

  // Expose globally for testing/debugging
  window._board = { storage, renderer, network, history, tools, notes, voice };
})();
</script>
